<svg xmlns="http://www.w3.org/2000/svg" width="680" viewBox="0 0 680 320" font-family="sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="680" height="320" rx="12" fill="#FAFAF7"/>

  <!-- 定義する側 container (blue) -->
  <rect x="40" y="40" width="280" height="200" rx="12" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="180" y="66" text-anchor="middle" font-size="14" font-weight="500" fill="#042C53">定義する側</text>
  <text x="180" y="84" text-anchor="middle" font-size="12" fill="#185FA5">app/Models/User.php</text>

  <!-- namespace (teal) -->
  <rect x="64" y="104" width="232" height="50" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="180" y="125" text-anchor="middle" font-size="14" font-weight="500" fill="#04342C">namespace App\Models;</text>
  <text x="180" y="143" text-anchor="middle" font-size="12" fill="#0F6E56">クラスに住所を付ける</text>

  <!-- class User (gray) -->
  <rect x="64" y="166" width="232" height="50" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="180" y="187" text-anchor="middle" font-size="14" font-weight="500" fill="#2C2C2A">class User { ... }</text>
  <text x="180" y="205" text-anchor="middle" font-size="12" fill="#5F5E5A">フルネーム: App\Models\User</text>

  <text x="350" y="124" text-anchor="middle" font-size="12" fill="#5F5E5A">この住所を</text>
  <text x="350" y="140" text-anchor="middle" font-size="12" fill="#5F5E5A">指して呼ぶ</text>
  <line x1="320" y1="160" x2="358" y2="160" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 使う側 container (purple) -->
  <rect x="360" y="40" width="280" height="200" rx="12" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="500" y="66" text-anchor="middle" font-size="14" font-weight="500" fill="#26215C">使う側</text>
  <text x="500" y="84" text-anchor="middle" font-size="12" fill="#534AB7">index.php など別ファイル</text>

  <!-- use (amber) -->
  <rect x="384" y="104" width="232" height="50" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <text x="500" y="125" text-anchor="middle" font-size="14" font-weight="500" fill="#412402">use App\Models\User;</text>
  <text x="500" y="143" text-anchor="middle" font-size="12" fill="#854F0B">省略名を登録する</text>

  <!-- new User (gray) -->
  <rect x="384" y="166" width="232" height="50" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="500" y="187" text-anchor="middle" font-size="14" font-weight="500" fill="#2C2C2A">new User();</text>
  <text x="500" y="205" text-anchor="middle" font-size="12" fill="#5F5E5A">短い名前で呼べる</text>

  <text x="340" y="280" text-anchor="middle" font-size="12" fill="#5F5E5A">namespace = 住所を付ける（定義側）／ use = 省略名を登録する（呼ぶ側）</text>
</svg>