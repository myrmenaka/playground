<svg xmlns="http://www.w3.org/2000/svg" width="680" viewBox="0 0 680 360" font-family="sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="680" height="360" rx="12" fill="#FAFAF7"/>

  <!-- composer.json (blue) -->
  <rect x="40" y="40" width="180" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="130" y="64" text-anchor="middle" font-size="14" font-weight="500" fill="#042C53">composer.json</text>
  <text x="130" y="82" text-anchor="middle" font-size="12" fill="#185FA5">必要な物を宣言</text>

  <text x="130" y="118" text-anchor="middle" font-size="12" fill="#5F5E5A">composer install</text>
  <line x1="130" y1="100" x2="130" y2="150" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Composer本体 (gray) -->
  <rect x="40" y="156" width="180" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="130" y="180" text-anchor="middle" font-size="14" font-weight="500" fill="#2C2C2A">Composer 本体</text>
  <text x="130" y="198" text-anchor="middle" font-size="12" fill="#5F5E5A">依存を解決</text>

  <text x="350" y="172" text-anchor="middle" font-size="12" fill="#5F5E5A">取得</text>
  <line x1="220" y1="184" x2="448" y2="184" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Packagist (purple) -->
  <rect x="450" y="156" width="190" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="545" y="180" text-anchor="middle" font-size="14" font-weight="500" fill="#26215C">Packagist</text>
  <text x="545" y="198" text-anchor="middle" font-size="12" fill="#534AB7">パッケージ置き場</text>

  <line x1="130" y1="212" x2="130" y2="252" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- vendor (teal) -->
  <rect x="40" y="258" width="180" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="130" y="282" text-anchor="middle" font-size="14" font-weight="500" fill="#04342C">vendor/</text>
  <text x="130" y="300" text-anchor="middle" font-size="12" fill="#0F6E56">実体が入る</text>

  <!-- composer.lock (teal) -->
  <rect x="250" y="258" width="180" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="340" y="282" text-anchor="middle" font-size="14" font-weight="500" fill="#04342C">composer.lock</text>
  <text x="340" y="300" text-anchor="middle" font-size="12" fill="#0F6E56">入れた版を固定</text>

  <!-- autoload.php (teal) -->
  <rect x="460" y="258" width="180" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="550" y="282" text-anchor="middle" font-size="14" font-weight="500" fill="#04342C">autoload.php</text>
  <text x="550" y="300" text-anchor="middle" font-size="12" fill="#0F6E56">読み込み係を生成</text>
</svg>